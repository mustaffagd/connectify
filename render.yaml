services:
  - type: web
    name: connectify-api
    runtime: node
    region: frankfurt
    rootDir: server
    buildCommand: npm install && npm run migrate
    startCommand: node src/server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: connectify-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: CLIENT_URL
        sync: false
      - key: STUN_SERVER_URL
        value: stun:stun.l.google.com:19302

  - type: web
    name: connectify-client
    runtime: static
    region: frankfurt
    rootDir: client
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        fromService:
          name: connectify-api
          property: url
      - key: VITE_SOCKET_URL
        fromService:
          name: connectify-api
          property: url

  - type: pgsql
    name: connectify-db
    databaseName: connectify_db
    plan: free
